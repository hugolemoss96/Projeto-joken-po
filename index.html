<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>JokenPô</title>
</head>

<body>
    <div class="caixa">
        <h1><b>JokenPô</b></h1>

        <div class="botoes">
        <button id="pedra" onclick="playHumano('pedra')">&#x1F44A;</button>
        <button id="papel" onclick="playHumano('papel')">&#x1F590;</button>
        <button id="tesoura" onclick="playHumano('tesoura')">&#x270C;</button>
        </div>

        <p class="resultado"></p>

        <p class="pontuacao"><b>Sua Pontuação:</b> <span id="pontuacao">0</span></p>
        <p class="pontuacao-maquina"><b>Pontuação da Alexa:</b> <span id="pontuacao-maquina">0</span></p>
    </div>

</body>
<script src="./script.js"></script>
</html>
